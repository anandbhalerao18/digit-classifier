<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digit Classifier</title>

  <style>
    /* plain black page, one column, nothing fancy */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0b0b;
      color: #d8d8d8;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 64px 20px 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f2f2f2;
    }

    .sub {
      margin-top: 4px;
      margin-bottom: 28px;
      color: #8a8a8a;
      font-size: 14px;
    }

    /* upload area */
    .drop {
      border: 1px dashed #3a3a3a;
      border-radius: 6px;
      padding: 26px 16px;
      text-align: center;
      color: #8a8a8a;
      cursor: pointer;
    }
    .drop:hover, .drop.drag { border-color: #777; color: #cfcfcf; }
    .drop small { display: block; margin-top: 4px; color: #5f5f5f; font-size: 12px; }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 150px;
      margin: 0 auto 12px;
      border-radius: 4px;
      background: #fff;
    }

    /* button */
    button {
      margin-top: 14px;
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-family: inherit;
      color: #0b0b0b;
      background: #e6e6e6;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #ffffff; }
    button:disabled { background: #555; color: #999; cursor: default; }

    /* result */
    #result {
      display: none;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #222;
    }
    .label { color: #8a8a8a; font-size: 13px; }
    .digit-row { display: flex; align-items: baseline; gap: 14px; margin-top: 2px; }
    #bigDigit { font-size: 72px; line-height: 1; font-weight: 300; color: #fff; }
    #confText { color: #8a8a8a; }

    /* one thin bar, only for the predicted digit */
    .track { margin-top: 14px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #e6e6e6; transition: width 0.5s; }

    #error { display: none; margin-top: 14px; color: #e08a8a; font-size: 14px; }

    .foot { margin-top: 48px; color: #4d4d4d; font-size: 12px; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Digit Classifier</h1>
    <p class="sub">Upload an image of a handwritten digit (0-9).</p>

    <!-- click here or drag an image into it -->
    <div class="drop" id="dropzone">
      <img id="preview" alt="">
      <span id="dropText">Choose an image or drop it here</span>
      <small>PNG or JPG, one digit</small>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>

    <button id="predictBtn">Predict</button>
    <p id="error"></p>

    <!-- filled in by JavaScript after the prediction -->
    <div id="result">
      <div class="label">Prediction</div>
      <div class="digit-row">
        <span id="bigDigit">-</span>
        <span id="confText"></span>
      </div>
      <div class="track"><div id="fill"></div></div>
    </div>

    <p class="foot">CNN trained on MNIST, served with FastAPI</p>
  </div>

  <script>
    var dropzone = document.getElementById("dropzone");
    var fileInput = document.getElementById("fileInput");
    var preview = document.getElementById("preview");
    var dropText = document.getElementById("dropText");
    var predictBtn = document.getElementById("predictBtn");
    var errorBox = document.getElementById("error");
    var resultBox = document.getElementById("result");

    var chosenFile = null;   // the image the user picked

    // clicking the box opens the file chooser
    dropzone.onclick = function () { fileInput.click(); };

    fileInput.onchange = function () {
      if (fileInput.files[0]) { setFile(fileInput.files[0]); }
    };

    // drag and drop
    dropzone.ondragover = function (e) { e.preventDefault(); dropzone.classList.add("drag"); };
    dropzone.ondragleave = function () { dropzone.classList.remove("drag"); };
    dropzone.ondrop = function (e) {
      e.preventDefault();
      dropzone.classList.remove("drag");
      if (e.dataTransfer.files[0]) { setFile(e.dataTransfer.files[0]); }
    };

    // remember the file and show a small preview
    function setFile(file) {
      chosenFile = file;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      dropText.innerText = file.name;
      resultBox.style.display = "none";
      errorBox.style.display = "none";
    }

    function showError(message) {
      errorBox.innerText = message;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    // Predict button
    predictBtn.onclick = function () {
      if (!chosenFile) { showError("Choose an image first."); return; }

      var formData = new FormData();
      formData.append("file", chosenFile);

      predictBtn.disabled = true;
      predictBtn.innerText = "Predicting...";
      errorBox.style.display = "none";

      fetch("/predict", { method: "POST", body: formData })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.detail) { showError(data.detail); } else { showResult(data); }
        })
        .catch(function () { showError("Could not reach the server. Is it running?"); })
        .then(function () {
          predictBtn.disabled = false;
          predictBtn.innerText = "Predict";
        });
    };

    // show the digit, the confidence and one bar for that confidence
    function showResult(data) {
      var pct = (data.confidence * 100).toFixed(1);
      document.getElementById("bigDigit").innerText = data.predicted_digit;
      document.getElementById("confText").innerText = pct + "% confidence";
      resultBox.style.display = "block";

      var fill = document.getElementById("fill");
      fill.style.width = "0";
      setTimeout(function () { fill.style.width = pct + "%"; }, 50);
    }
  </script>
</body>
</html>
